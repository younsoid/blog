name: Deploy to younsoid.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true   # themes/book (pinned commit)
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: younsoid/younsoid.github.io
          publish_branch: main
          publish_dir: ./public
          user_name: younsoid
          user_email: younsoid@users.noreply.github.com
          full_commit_message: "Deploy site: ${{ github.event.head_commit.message }}"
